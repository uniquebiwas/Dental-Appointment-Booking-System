{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card-soft p-4 p-md-5">
            <div class="pill pill-success mb-3"><i class="bi bi-shield-lock"></i> Secure access</div>
            <h3 class="fw-bold mb-2">Welcome back</h3>
            <p class="text-muted mb-4">Sign in to access your dental care dashboard.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Login</button>
            </form>
            <p class="text-muted mt-3 mb-0">New patient? <a href="{% url 'register' %}">Create an account</a>.</p>
        </div>
    </div>
</div>
{% endblock %}
