{% extends 'base.html' %}
{% block content %}
<div class="dashboard-shell">
    {% include 'dashboard/_sidebar.html' %}
    <div class="main-panel">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card-soft p-4 p-md-5 text-center">
                    <h3 class="fw-bold mb-3">Delete User?</h3>
                    <p class="text-muted">This action cannot be easily undone. Continue only if you are sure.</p>
                    <form method="post">
                        {% csrf_token %}
                        <a class="btn btn-outline-secondary" href="{% if back_url %}{% url back_url %}{% else %}{% url 'admin_users' %}{% endif %}">Cancel</a>
                        <button class="btn btn-danger" type="submit">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
