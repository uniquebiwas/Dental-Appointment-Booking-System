{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="mb-3">Reschedule Appointment</h3>
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Date</label>
                    <input class="form-control" type="date" name="appointment_date" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Time</label>
                    <input class="form-control" type="time" name="start_time" required>
                </div>
            </div>
            <button class="btn btn-primary mt-3" type="submit">Reschedule</button>
        </form>
    </div>
</div>
{% endblock %}
