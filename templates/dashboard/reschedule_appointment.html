{% extends 'base.html' %}
{% block content %}
<div class="dashboard-shell">
    <aside class="sidebar">
        <h4 class="fw-bold mb-4">Patient Portal</h4>
        <nav class="nav flex-column">
            <a class="nav-link" href="{% url 'patient_dashboard' %}"><i class="bi bi-columns-gap me-2"></i>Overview</a>
            <a class="nav-link" href="{% url 'book_appointment' %}"><i class="bi bi-calendar-plus me-2"></i>Book</a>
            <a class="nav-link" href="{% url 'patient_history' %}"><i class="bi bi-clock-history me-2"></i>History</a>
            <a class="nav-link" href="{% url 'patient_profile' %}"><i class="bi bi-person-lines-fill me-2"></i>Profile</a>
            <a class="nav-link" href="{% url 'notifications' %}"><i class="bi bi-bell me-2"></i>Notifications</a>
        </nav>
    </aside>
    <div class="main-panel">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-3">Reschedule Appointment</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Date</label>
                            <input class="form-control" type="date" name="appointment_date" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Time</label>
                            <input class="form-control" type="time" name="start_time" required>
                        </div>
                    </div>
                    <button class="btn btn-primary mt-3" type="submit">Reschedule</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
