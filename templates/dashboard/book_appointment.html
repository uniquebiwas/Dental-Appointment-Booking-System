{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-soft p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h3 class="fw-bold mb-2">Book a dental appointment</h3>
                    <p class="text-muted mb-0">Choose your dentist, service and time slot in just a few steps.</p>
                </div>
                <div class="pill pill-success">Secure</div>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Dentist</label>
                        <select class="form-select" name="dentist" required>
                            {% for dentist in dentists %}<option value="{{ dentist.pk }}">{{ dentist }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Service</label>
                        <select class="form-select" name="service" required>
                            {% for service in services %}<option value="{{ service.pk }}">{{ service.name }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date</label>
                        <input class="form-control" type="date" name="appointment_date" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Time</label>
                        <input class="form-control" type="time" name="start_time" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Reason</label>
                        <textarea class="form-control" name="reason" rows="4" required></textarea>
                    </div>
                </div>
                <button class="btn btn-primary mt-4" type="submit">Confirm Booking</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
