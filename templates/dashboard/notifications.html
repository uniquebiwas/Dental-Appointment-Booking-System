{% extends 'base.html' %}
{% block content %}
<div class="dashboard-shell">
    <aside class="sidebar">
        <h4 class="fw-bold mb-4">Notifications</h4>
        <nav class="nav flex-column">
            <a class="nav-link active" href="{% url 'notifications' %}"><i class="bi bi-bell me-2"></i>Notifications</a>
            <a class="nav-link" href="{% url 'home' %}"><i class="bi bi-house-door me-2"></i>Home</a>
            <a class="nav-link" data-swal-confirm href="{% url 'logout' %}" data-title="Logout" data-text="Are you sure you want to log out?" data-confirm-button-text="Logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </nav>
    </aside>
    <div class="main-panel">
    <h3 class="fw-bold mb-3">Notifications</h3>
    <div class="d-flex flex-column gap-3">
        {% for notification in notifications %}
        <div class="border rounded-3 p-3">
            <div class="d-flex justify-content-between align-items-start">
                <strong>{{ notification.title }}</strong>
                <span class="pill pill-success">new</span>
            </div>
            <div class="text-muted mt-2">{{ notification.message }}</div>
            <small class="text-muted">{{ notification.created_at }}</small>
        </div>
        {% empty %}
        <div class="empty-state">No notifications yet.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
